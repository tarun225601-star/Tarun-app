<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AI Video Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 0;
            border-bottom: 1px solid #1f2937;
        }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .settings-btn {
            background: #1f2937;
            border: none;
            color: #9ca3af;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .settings-btn:hover {
            background: #374151;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #111827;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }
        .upload-section {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            background: #0f172a;
        }
        .upload-section:hover {
            border-color: #6366f1;
            background: #1e1b4b33;
        }
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #818cf8;
        }
        .upload-text {
            color: #9ca3af;
            font-size: 0.95rem;
        }
        .upload-text span {
            color: #818cf8;
            font-weight: bold;
        }
        #file-input {
            display: none;
        }
        .preview-container {
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 250px;
            border-radius: 8px;
            background: #000;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .action-btn:disabled {
            background: #374151;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            background: #1f2937;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid #374151;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            transition: width 0.2s linear;
        }
        .progress-status {
            font-size: 0.9rem;
            color: #9ca3af;
            text-align: center;
            font-weight: 600;
        }
        .result-section {
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            width: 100%;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            text-align: center;
        }
        .download-btn:hover {
            background: #059669;
        }
        /* Modal for Admin Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: #111827;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #374151;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f3f4f6;
        }
        .modal-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #374151;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .modal-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
        }
        .modal-save {
            flex: 1;
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-save:hover {
            background: #4f46e5;
        }
        .modal-close {
            flex: 1;
            background: #374151;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-close:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Cinematic AI Editor</h1>
        <button class="settings-btn" id="open-settings" title="Admin Settings">⚙️</button>
    </header>

    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section" id="drop-zone">
            <div class="upload-icon">📁</div>
            <div class="upload-text">गैलरी से वीडियो चुनें या <span>यहाँ क्लिक करें</span></div>
            <input type="file" id="file-input" accept="video/*">
        </div>

        <!-- Video Preview -->
        <div class="preview-container" id="preview-box">
            <video id="video-preview" controls></video>
        </div>

        <!-- Action Button -->
        <button class="action-btn" id="process-btn" disabled>✨ Apply Cinematic Magic</button>

        <!-- Progress Bar (0 to 100%) -->
        <div class="progress-container" id="progress-box">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="progress-status" id="progress-text">Processing... 0%</div>
        </div>

        <!-- Result / Download Section -->
        <div class="result-section" id="result-box">
            <h3 style="color: #10b981; margin-bottom: 8px; font-size: 1.1rem;">🎉 Cinematic Video Ready!</h3>
            <p style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 15px;">वीडियो सफलतापूर्वक तैयार हो चुकी है।</p>
            <a href="#" class="download-btn" id="download-link" download="cinematic_masterpiece.mp4">⬇️ Download to Gallery</a>
        </div>
    </div>

    <!-- Admin Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">⚙️ Admin Master Settings</div>
            <p style="font-size: 0.82rem; color: #9ca3af; margin-bottom: 12px;">अपनी Runway या मास्टर API Key यहाँ दर्ज करें (यह आपके ब्राउज़र/डिवाइस में परमानेंट सेव रहेगी):</p>
            <input type="password" class="modal-input" id="master-key-input" placeholder="runway_api_key_here...">
            <div class="modal-btn-group">
                <button class="modal-save" id="save-key-btn">Save Key</button>
                <button class="modal-close" id="close-modal-btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        const openSettingsBtn = document.getElementById('open-settings');
        const settingsModal = document.getElementById('settings-modal');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const masterKeyInput = document.getElementById('master-key-input');

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewBox = document.getElementById('preview-box');
        const videoPreview = document.getElementById('video-preview');
        const processBtn = document.getElementById('process-btn');
        const progressBox = document.getElementById('progress-box');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const resultBox = document.getElementById('result-box');
        const downloadLink = document.getElementById('download-link');

        let selectedFileUrl = null;

        // सेटिंग्स खोलना
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
            masterKeyInput.value = localStorage.getItem('app_master_api_key') || '';
        });

        closeModalBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveKeyBtn.addEventListener('click', () => {
            const key = masterKeyInput.value.trim();
            if (key) {
                localStorage.setItem('app_master_api_key', key);
                alert('Master API Key Successfully Saved!');
                settingsModal.style.display = 'none';
            } else {
                alert('कृपया खाली की (Key) न डालें!');
            }
        });

        // गैलरी से वीडियो चुनना
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFileUrl = URL.createObjectURL(file);
                videoPreview.src = selectedFileUrl;
                dropZone.style.display = 'none';
                previewBox.style.display = 'block';
                processBtn.disabled = false;
                resultBox.style.display = 'none';
            }
        });

        // मैजिक बटन और 100% प्रोग्रेस बार
        processBtn.addEventListener('click', () => {
            const savedKey = localStorage.getItem('app_master_api_key');
            if (!savedKey) {
                alert("कृपया पहले ऊपर कोने में ⚙️ सेटिंग पर क्लिक करके अपनी मास्टर API Key सेव करें!");
                settingsModal.style.display = 'flex';
                return;
            }

            processBtn.style.display = 'none';
            progressBox.style.display = 'block';
            resultBox.style.display = 'none';

            let progress = 0;
            const steps = [
                "Connecting to Runway/Master AI Engine...",
                "Uploading video & analyzing frames...",
                "Applying Hollywood Color Grading & LUTs...",
                "Finalizing high-res cinematic render..."
            ];

            const interval = setInterval(() => {
                progress += 2; // 0 से 100% तक स्मूथ चलना
                if (progress > 100) progress = 100;

                progressBar.style.width = progress + '%';
                
                let stepIndex = Math.floor(progress / 25);
                if(stepIndex >= steps.length) stepIndex = steps.length - 1;
                progressText.innerText = `${steps[stepIndex]} (${progress}%)`;

                if (progress === 100) {
                    clearInterval(interval);
                    progressBox.style.display = 'none';
                    resultBox.style.display = 'block';
                    
                    // सीधे गैलरी/डाउनलोड में सेव होने के लिए लिंक सेट करना
                    downloadLink.href = selectedFileUrl;
                    
                    processBtn.style.display = 'block';
                    processBtn.disabled = true;
                }
            }, 50);
        });
    </script>
</body>
</html>
